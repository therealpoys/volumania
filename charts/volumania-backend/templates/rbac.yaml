apiVersion: v1
kind: ServiceAccount
metadata:
  name: volumania-backend

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: volumania-backend
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: volumania-backend
subjects:
  - kind: ServiceAccount
    name: volumania-backend
roleRef:
  kind: Role
  name: volumania-backend
  apiGroup: rbac.authorization.k8s.io
